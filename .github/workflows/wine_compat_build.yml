name: Wine-compat FiveM build

# Compila o cliente FiveM com os patches de compatibilidade Wine/Proton e
# publica os binarios como artifact. O ci_build.yml do upstream apenas valida
# a compilacao e nao sobe nada, por isso este workflow separado.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: FiveM (wine-compat)
    runs-on: windows-2022  # o build hardcoda VS 2022; windows-latest ja migrou para VS 18
    timeout-minutes: 180
    env:
      PROGRAM: five
    steps:
      - name: Checkout
        shell: bash
        run: |
          # D: e pequeno demais para a arvore do FiveM, entao usamos C:
          ROOT="C:\b"
          ROOT_REPO="$ROOT/$PROGRAM"
          ROOT_DEP="$ROOT/dep"
          JOB_SLOTS=$(nproc --all)

          echo "ROOT_REPO=$ROOT_REPO" >> "$GITHUB_ENV"
          echo "ROOT_DEP=$ROOT_DEP" >> "$GITHUB_ENV"
          echo "JOB_SLOTS=$JOB_SLOTS" >> "$GITHUB_ENV"

          mkdir -p "$ROOT_REPO" && cd "$_" || exit 1

          git init .
          git config core.symlinks true
          git remote add origin "https://github.com/${{ github.repository }}"
          git pull origin "${{ github.ref_name }}" --depth=1
          git submodule update --jobs=$JOB_SLOTS --init --depth=1

      - name: Dependencies
        shell: bash
        run: mkdir -p "$ROOT_DEP" && cd "$_" || exit 1

      - name: Install Windows 11 SDK 22000
        shell: pwsh
        run: |
          # A solucao aponta para 10.0.22000.0. A imagem windows-2022 traz
          # 19041/22621/26100, mas nao esse. vs_installer nao funciona headless
          # aqui, entao usamos o choco e caimos no instalador oficial se falhar.
          $sdkInc = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.22000.0"

          choco install windows-sdk-11-version-21h2-all -y --no-progress
          Write-Host "choco exit: $LASTEXITCODE"

          if (-not (Test-Path $sdkInc)) {
            Write-Host "choco nao entregou o SDK; tentando o instalador oficial."
            $url = "https://go.microsoft.com/fwlink/p/?linkid=2196241"
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\winsdksetup.exe"
            $p = Start-Process -FilePath "$env:RUNNER_TEMP\winsdksetup.exe" `
              -ArgumentList "/quiet","/norestart","/features","OptionId.WindowsDesktopSoftwareDevelopmentKit" `
              -Wait -PassThru -NoNewWindow
            Write-Host "winsdksetup exit: $($p.ExitCode)"
          }

          if (Test-Path $sdkInc) {
            Write-Host "SDK 10.0.22000.0 disponivel."
          } else {
            Write-Host "::error::SDK 10.0.22000.0 continua ausente."
            Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Select-Object -ExpandProperty Name
            exit 1
          }

      - name: Compile
        shell: bash
        run: |
          cd "$ROOT_REPO"
          BUILD_SCRIPT=".github/workflows/ci/build_windows.sh"
          PLATFORM=
          chmod +x "$BUILD_SCRIPT"
          $BUILD_SCRIPT "$ROOT_DEP" $JOB_SLOTS

      - name: Locate output
        shell: bash
        run: |
          cd "$ROOT_REPO"
          echo "--- binarios encontrados ---"
          find code/bin -maxdepth 4 -type f \( -name '*.dll' -o -name '*.exe' \) -printf '%10s  %p\n' | sort -k2 | head -60
          echo "--- alvos do patch ---"
          find code/bin -name 'CoreRT.dll' -o -name 'FiveM.exe' | while read f; do
            echo "$(sha256sum "$f")"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: FiveM-wine-compat-x64
          path: C:\b\five\code\bin\five\release
          if-no-files-found: error
          retention-days: 30
